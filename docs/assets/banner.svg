    <path d="M796 90L1190 288" stroke="#EEF8FF" stroke-opacity=".07" stroke-width="100"/>
  </g>
  <path d="M823 246L1140 305" stroke="#B9D1EF" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
