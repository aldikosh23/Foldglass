  <path d="M804 94Q803 78 820 82L1150 145Q1166 148 1165 164L1159 283Q1158 296 1143 293L823 235Q811 233 810 220Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
  <g clip-path="url(#panel)">
